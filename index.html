<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOSDPZ · Cobertura Operativa Provincia de Zaragoza</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<!-- Unión real de polígonos (para el perímetro exterior de la zona ampliada) -->
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.js"></script>
<style>
  :root{
    --bg:#f4f1ea; --pane:#ffffff; --tinta:#1a1a1a; --oro:#c9a24b; --rojo:#b31f26;
    --v:#2ecc71; --a:#f1c40f; --n:#e67e22; --r:#c0392b; --k:#5a0810; --g:#95a5a6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',Arial,sans-serif;color:var(--tinta);background:var(--bg)}
  #app{display:flex;height:100vh;overflow:hidden}
  aside{width:340px;background:var(--pane);border-right:2px solid var(--tinta);padding:14px 12px;overflow-y:auto;flex-shrink:0}
  aside h1{font-size:18px;margin:0 0 4px;color:var(--rojo);letter-spacing:.02em}
  aside .sub{font-size:11px;color:#666;margin-bottom:14px}
  .leyenda{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:8px;background:#f9f5ea;border-radius:6px;border:1px solid #d7cba5}
  .leyenda span{font-size:10px;padding:2px 6px;border-radius:3px;color:#111;font-weight:700}
  .parque{background:var(--pane);border:1.5px solid #ddd;border-radius:8px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 3px #0001}
  /* Chip de parque cerrado: banda hazard amarillo/negro en el borde
     izquierdo y borde negro grueso, para que salte a la vista al hojear
     el panel lateral y localizar rápido qué parques están sin dotación. */
  .parque.cerrado{
    border:2px solid #ffdd00;
    border-left:14px solid transparent;
    border-image: repeating-linear-gradient(135deg,#ffdd00 0 8px,#000 8px 14px) 14;
    background:#000;
    box-shadow:0 0 0 2px #000, 0 2px 5px #0004;
  }
  .parque.cerrado .parque-nom{color:#ffdd00}
  .parque.cerrado .stats{color:#ffdd00;font-weight:700}
  .parque.cerrado .bom-ctrl input{background:#ffdd00;color:#000;border-color:#ffdd00}
  .parque-cab{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .parque-cab .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
  .parque-nom{font-weight:800;font-size:14px;flex:1}
  .bom-ctrl{display:flex;align-items:center;gap:4px}
  .bom-ctrl button{width:24px;height:24px;border-radius:4px;border:1px solid #999;background:#fff;font-weight:800;cursor:pointer;font-size:14px;padding:0}
  .bom-ctrl button:hover{background:#f0e5cc}
  .bom-ctrl input{width:38px;text-align:center;padding:3px 2px;border:1px solid #999;border-radius:4px;font-weight:800;font-size:14px}
  .bom-ico{font-size:16px;margin-right:2px}
  .stats{font-size:11px;color:#444;line-height:1.5}
  .stats b{color:var(--tinta)}
  #map-wrap{flex:1;height:100%;position:relative;min-width:0}
  #map{width:100%;height:100%;background:#faf3e0}
  .leaflet-container{background:#faf3e0}
  #legend-map{position:absolute;top:18px;right:14px;background:#fff;border:2px solid #1a1a1a;border-radius:8px;padding:8px 10px;box-shadow:0 3px 8px #0005;z-index:1000;font-size:12px;font-weight:700;cursor:move;user-select:none;touch-action:none}
  #legend-map:hover{box-shadow:0 3px 12px #0007}
  #legend-map .titulo{cursor:move}
  #legend-map .titulo{font-size:12px;font-weight:900;color:var(--rojo);margin-bottom:8px;text-align:center;letter-spacing:.03em}
  #legend-map .fila{display:flex;align-items:center;gap:7px;margin:4px 0}
  #legend-map .caja{width:22px;height:16px;border:1.5px solid #333;border-radius:3px;flex-shrink:0}
  /* ── MÓVIL ── */
  #toggle-panel{display:none}
  @media (max-width:768px){
    #app{flex-direction:column}
    aside{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100vh;max-height:none;border-right:none;border-bottom:none;padding:60px 12px 20px;z-index:1800;overflow-y:auto}
    aside h1{font-size:16px}
    aside .sub{font-size:10px;margin-bottom:8px}
    .leyenda{padding:6px;gap:4px;margin-bottom:8px}
    .leyenda span{font-size:9px;padding:2px 5px}
    .parque{padding:7px 9px;margin-bottom:6px}
    .parque-nom{font-size:12px}
    .bom-ctrl button{width:28px;height:28px;font-size:16px}
    .bom-ctrl input{width:44px;font-size:14px}
    .stats{font-size:10px}
    .totales{font-size:11px;padding:8px}
    #map-wrap{height:auto;flex:1;min-height:45vh}
    #legend-map{font-size:10px;padding:5px 7px}
    #legend-map .titulo{font-size:10px;margin-bottom:5px}
    #legend-map .caja{width:16px;height:12px}
    /* Botón flotante para colapsar/desplegar panel en móvil */
    #toggle-panel{display:flex;position:fixed;top:8px;left:64px;z-index:2000;
      background:var(--rojo);color:#fff;border:2px solid #fff;border-radius:8px;
      width:44px;height:44px;align-items:center;justify-content:center;
      font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px #0007}
    aside.oculto{display:none}
    #app.panel-oculto #map-wrap{height:100vh}
  }
  .modo-tabs{display:flex;gap:6px;margin-bottom:12px}
  .modo-tabs button{flex:1;padding:8px 6px;border:2px solid var(--tinta);background:#f4f1ea;color:var(--tinta);font-weight:800;font-size:12px;border-radius:6px;cursor:pointer}
  .modo-tabs button:hover{background:#eddfc7}
  .modo-tabs button.on{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  /* Botón toggle de empresas + marca de empresa (magenta, para destacar sobre la
     paleta térmica verde→rojo de los municipios). Solo en modo Tiempos mínimos. */
  #btn-empresas{width:100%;margin-bottom:12px;padding:8px 6px;border:2px solid #ff009d;
     background:#fff;color:#b3006e;font-weight:800;font-size:12px;border-radius:6px;cursor:pointer;
     display:flex;align-items:center;justify-content:center;gap:6px}
  #btn-empresas:hover{background:#ffe6f4}
  #btn-empresas.on{background:#ff009d;color:#fff}
  #btn-empresas:disabled{opacity:.4;cursor:not-allowed;background:#fff;color:#b3006e}
  .emp-mark{width:14px;height:14px;border-radius:50%;background:#ff009d;
     border:2.5px solid #fff;box-shadow:0 0 0 1.6px #40002a,0 2px 5px #0008;cursor:pointer}
  .emp-mark:hover{transform:scale(1.25)}
  .emp-tip{font-family:inherit;font-size:12px}
  .emp-tip b{color:#b3006e}
  .totales{margin-top:14px;padding:10px;background:#fff5e0;border:1.5px solid var(--oro);border-radius:6px;font-size:12px}
  .totales b{color:var(--rojo)}
  .btn-reset{margin-top:10px;width:100%;padding:8px;background:var(--tinta);color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:700}
  .btn-reset:hover{background:var(--rojo)}
  /* Etiquetas de parque en mapa */
  .lbl-parque{background:rgba(255,255,255,.72);backdrop-filter:blur(2px);border:2px solid rgba(26,26,26,.9);border-radius:6px;padding:2px 5px;font-size:11px;font-weight:700;box-shadow:0 2px 5px #0004;text-align:center;line-height:1.15;white-space:nowrap;pointer-events:none}
  .lbl-parque .p-nom{font-size:14.5px;color:var(--rojo);text-shadow:0 0 3px #fff;font-weight:900}
  .lbl-parque .p-boms{font-size:17px;letter-spacing:1px;margin:0}
  .lbl-parque .p-stat{font-size:12.5px;color:#111;text-shadow:0 0 3px #fff;font-weight:700}
  .lbl-parque .p-stat b{color:var(--tinta);font-weight:900}
  /* Parque cerrado: estilo cinta de precaución (hazard) — máxima visibilidad.
     Fondo amarillo con rayas negras diagonales + borde negro grueso.
     El nombre del parque va en negro sobre banda amarilla, y la palabra
     CERRADO en negro sobre fondo amarillo puro con letter-spacing amplio. */
  .lbl-parque.cerrado{
    background: repeating-linear-gradient(135deg,
      #ffdd00 0px, #ffdd00 10px,
      #000 10px, #000 16px);
    border:3px solid #ffdd00;
    box-shadow:0 0 0 2px #000, 0 3px 8px #000a;
    padding:0;
    overflow:hidden;
    border-radius:4px;
  }
  .lbl-parque.cerrado .p-nom{
    background:#000;
    color:#ffdd00;
    text-shadow:none;
    padding:2px 8px;
    display:block;
    border-bottom:2px solid #ffdd00;
  }
  .lbl-parque.cerrado .p-boms{
    background:#000;
    color:#ffdd00 !important;
    font-weight:900;
    font-size:14px;
    letter-spacing:3px;
    padding:3px 8px;
    display:block;
  }
  .lbl-mun-name{background:transparent;border:none;color:#333;font-size:9px;font-weight:600;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;pointer-events:none}
  /* Panel "Municipios peor cubiertos" — TOP 10 por franja de tiempo, ordenados por población. */
  #peor-cubiertos{margin-top:14px;border-top:2px solid var(--tinta);padding-top:10px}
  #peor-cubiertos h2{font-size:13px;margin:0 0 8px;color:var(--rojo);letter-spacing:.02em}
  .franja{margin-bottom:10px;border-radius:6px;overflow:hidden;border:1.5px solid #ccc}
  .franja-cab{padding:4px 8px;font-size:11px;font-weight:800;color:#fff;display:flex;justify-content:space-between;align-items:center}
  .franja-cab .n-muns{background:rgba(255,255,255,.25);padding:1px 6px;border-radius:9px;font-size:10px}
  .franja-cab.k{background:var(--k)}
  .franja-cab.r{background:var(--r)}
  .franja-cab.n{background:var(--n)}
  .franja-cab.g{background:var(--g)}
  .franja ul{list-style:none;margin:0;padding:2px 0;background:#fff}
  .franja li{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;font-size:10.5px;line-height:1.35;border-bottom:1px solid #f0eadc}
  .franja li:last-child{border-bottom:none}
  .franja li .nom{font-weight:700;color:#111}
  .franja li .pob{color:#666;font-size:9.5px;margin-left:6px;white-space:nowrap}
  .franja li .t{background:#eee;padding:1px 5px;border-radius:3px;font-weight:800;font-size:10px;color:#111;margin-left:6px;white-space:nowrap}
  .franja .vacio{padding:4px 8px;font-size:10px;color:#999;font-style:italic;text-align:center}
  .franja li{cursor:pointer;transition:background .15s}
  .franja li:hover{background:#fff6d8}
  .franja li.activo{background:#ffdd00 !important;box-shadow:inset 3px 0 0 #000}
  /* Popup del municipio enfocado */
  .foco-popup{font-family:'Segoe UI',Arial,sans-serif;min-width:230px}
  .foco-popup .cab{padding:7px 11px;border-radius:5px 5px 0 0;color:#fff;text-align:center;text-shadow:0 1px 2px #0007;cursor:move;user-select:none}
  .foco-popup .cab:active{cursor:grabbing}
  .foco-popup .cab::before{content:'⋮⋮ ';opacity:.7;letter-spacing:-2px;font-weight:900;margin-right:3px}
  /* Cabecera sobre fondo amarillo (franja 15-35 min): texto negro, sin sombra,
     para que se lea con contraste correcto. */
  .foco-popup .cab.claro{color:#000;text-shadow:none}
  .foco-popup .cab .n{font-size:14.5px;font-weight:900;letter-spacing:.02em}
  .foco-popup .cab .p{font-size:11.5px;opacity:.95;margin-top:3px}
  /* Banda superior con el nombre de la empresa (cuando el panel se abre desde
     una marca de empresa). Magenta, a juego con la marca. */
  .foco-popup .emp-cab{background:#ff009d;color:#fff;padding:6px 12px;border-radius:5px 5px 0 0;
     text-align:center;font-weight:900;font-size:12.5px;line-height:1.25;letter-spacing:.01em;
     box-shadow:inset 0 -2px 0 #0003}
  .foco-popup table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
  .foco-popup td{padding:5px 8px;border-bottom:1px solid #eee}
  .foco-popup tr:last-child td{border-bottom:none}
  .foco-popup .p-nom{font-weight:700;color:#111}
  .foco-popup .p-min{text-align:right;font-weight:800;color:#111;font-variant-numeric:tabular-nums}
  .foco-popup .p-est{text-align:center;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:800;white-space:nowrap}
  .foco-popup .p-est.asig{background:#2ecc71;color:#fff}   /* fondo lo sobrescribe estilo inline */
  .foco-popup .p-est.ab{background:#eaeaea;color:#555}
  .foco-popup .p-est.cer{background:#000;color:#ffdd00;border:1px solid #ffdd00}
  /* Etiqueta del parque que cubre al mun enfocado: borde triple negro-color-negro,
     con el color del tiempo de llegada del mun en la banda central. Se aplica
     dinámicamente añadiendo la clase .cubre y la variable --cub-col. */
  .lbl-parque.cubre{
    border:3px solid #000 !important;
    box-shadow: 0 0 0 4px var(--cub-col,#c9a24b), 0 0 0 7px #000, 0 4px 10px #000a !important;
  }
  .foco-popup tr.asig{background:#e8f5e9}
  .foco-popup tr.cer{background:#fffbe6}
  .foco-popup .cerrar{display:block;text-align:center;padding:5px;background:#f3f3f3;color:#666;font-size:11px;cursor:pointer;border-top:1px solid #ddd;border-radius:0 0 5px 5px;font-weight:700}
  .foco-popup .cerrar:hover{background:#e8e8e8;color:#000}
  /* Ocultamos el pico nativo del popup: la unión visual mun↔popup se dibuja
     como polilínea hazard sobre el mapa (más gruesa y direccional). */
  .foco-popup-wrap .leaflet-popup-tip-container{display:none}
  .foco-popup-wrap .leaflet-popup-content-wrapper{padding:0;background:transparent;box-shadow:0 3px 10px #0006;border-radius:6px;overflow:hidden}
  .foco-popup-wrap .leaflet-popup-content{margin:0}
  /* Perímetro del mun enfocado: rayas hazard animadas ("marching ants"). */
  .foco-perim-halo{stroke:#000;stroke-width:8;fill:none;opacity:.85}
  .foco-perim-rayas{stroke:#ffdd00;stroke-width:5;stroke-dasharray:14 10;fill:none;opacity:1;animation:march 1s linear infinite}
  .foco-perim-interior{stroke:#ffdd00;stroke-width:1.5;fill:#ffdd00;fill-opacity:.18}
  @keyframes march{to{stroke-dashoffset:-24}}
  /* ── Zona de cobertura AMPLIADA (modo isócronas) ─────────────────
     Perímetro de la zona añadida como cinta hazard BLANCA/NEGRA móvil:
     base negra continua + rayas blancas discontinuas animadas encima
     (los huecos dejan ver el negro → blanco/negro alternos). */
  .zona-perim-halo{stroke:#111;stroke-width:10;fill:none;opacity:.95;stroke-linejoin:round;stroke-linecap:round}
  .zona-perim-rayas{stroke:#ffdd00;stroke-width:6;stroke-dasharray:14 10;fill:none;opacity:1;stroke-linejoin:round;stroke-linecap:butt;animation:march 1s linear infinite}
  .zona-fill{stroke:none;fill:#000;fill-opacity:.10}
  .zona-mun-hl{stroke:#000;stroke-width:3;fill:#fff;fill-opacity:.32}
  .lbl-parque.clk{pointer-events:auto;cursor:pointer}
  .lbl-parque.zona-activo{outline:3px solid var(--rojo);box-shadow:0 0 0 3px #fff,0 0 14px var(--rojo)}
  /* Panel flotante de la zona (estilo hazard, como parque cerrado) */
  #zona-panel{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1200;
    background:repeating-linear-gradient(45deg,#ffdd00 0 14px,#111 14px 28px);
    padding:3px;border-radius:11px;box-shadow:0 5px 16px #0008;cursor:move;max-width:92%;user-select:none}
  #zona-panel .in{background:#fff;border-radius:9px;padding:11px 17px;text-align:center}
  #zona-panel .tit{font-weight:900;color:var(--rojo);font-size:18px;margin-bottom:5px}
  #zona-panel .met{font-size:15px;color:#111;font-weight:700;line-height:1.6}
  #zona-panel .met b{color:#000;font-size:16.5px}
  #zona-panel .motivo{font-size:14.5px;color:var(--rojo);font-weight:800;margin-top:6px;
    border-top:1px dashed #ccc;padding-top:6px}
  #zona-panel .hint{font-size:12px;color:#777;margin-top:5px;font-weight:600}
  /* Cartel hazard del municipio absorbido */
  .zona-cartel{background:repeating-linear-gradient(45deg,#ffdd00 0 15px,#111 15px 30px);
    padding:6px;border-radius:12px;box-shadow:0 7px 20px #000a;cursor:move;user-select:none}
  .zona-cartel .in{background:#fff;border-radius:7px;padding:10px 14px;text-align:center;border:3px solid #111}
  .zona-cartel .n{font-weight:900;color:#111;font-size:17px}
  .zona-cartel .pob{font-size:13px;color:#333;font-weight:700;margin-top:2px}
  .zona-cartel .dt{margin-top:8px;background:var(--rojo);color:#fff;font-weight:900;font-size:22px;
    border:3px solid #111;border-radius:7px;padding:4px 12px;display:inline-block;letter-spacing:.03em;
    text-transform:uppercase;box-shadow:0 0 0 3.5px #ffdd00}
  .zona-cartel .tot{margin-top:8px;font-size:18px;color:#111;font-weight:800}
  .zona-cartel .tot b{color:var(--rojo);font-size:21px}
</style>
</head>
<body>
<div id="app">
  <button id="toggle-panel" onclick="togglePanel()" title="Mostrar/ocultar panel">☰</button>
  <aside>
    <h1>🚒 SOSDPZ · Cobertura</h1>
    <div class="sub">Cierra o abre parques ajustando bomberos. Los muns se reasignan al siguiente parque disponible.</div>
    <div class="modo-tabs">
      <button id="tab-tiempos" class="on" onclick="setModo('tiempos')">⏱ Tiempos mínimos</button>
      <button id="tab-isocronas" onclick="setModo('isocronas')">🗺 Isócronas</button>
    </div>
    <button id="btn-empresas" onclick="toggleEmpresas()" title="Muestra las principales empresas ubicadas fuera de la capital (solo en modo Tiempos mínimos)">🏭 Empresas (fuera de la capital)</button>
    <div class="leyenda">
      <span style="background:var(--v)">0–15 min</span>
      <span style="background:var(--a)">15–35 min</span>
      <span style="background:var(--n);color:#fff">35–45 min</span>
      <span style="background:var(--r);color:#fff">45–55 min</span>
      <span style="background:var(--k);color:#fff">&gt;55 min</span>
      <span style="background:var(--g);color:#fff">Sin cobertura</span>
    </div>
    <div id="parques-lista"></div>
    <div class="totales" id="totales"></div>
    <div id="peor-cubiertos"></div>
    <button class="btn-reset" onclick="resetear()">Restablecer valores por defecto</button>
  </aside>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend-map">
      <div class="titulo">TIEMPO DE LLEGADA</div>
      <div class="fila"><span class="caja" style="background:var(--v)"></span>0 – 15 min</div>
      <div class="fila"><span class="caja" style="background:var(--a)"></span>15 – 35 min</div>
      <div class="fila"><span class="caja" style="background:var(--n)"></span>35 – 45 min</div>
      <div class="fila"><span class="caja" style="background:var(--r)"></span>45 – 55 min</div>
      <div class="fila"><span class="caja" style="background:var(--k)"></span>&gt; 55 min</div>
    </div>
  </div>
</div>
<script>
// ─── Datos y estado ────────────────────────────────────────────
let DATOS = null;
const BOMBEROS_DEFAULT = {
  'Tarazona':4, 'Calatayud':4, 'Ejea de los Caballeros':4, 'Caspe':4, 'La Almunia de Doña Godina':4,
  'Tauste':2, 'Daroca':2, 'Cariñena':2, 'El Burgo de Ebro':2
};
let bomberos = {...BOMBEROS_DEFAULT};
let modo = 'tiempos'; // 'tiempos' o 'isocronas'
const PARQUE_COLOR = {
  'Zaragoza':'#b31f26',
  'Tarazona':'#8e44ad','Calatayud':'#2980b9','Ejea de los Caballeros':'#16a085',
  'Caspe':'#d35400','La Almunia de Doña Godina':'#c0392b','Tauste':'#27ae60',
  'Daroca':'#f39c12','Cariñena':'#7f8c8d','El Burgo de Ebro':'#e67e22'
};

// ─── Mapa Leaflet ──────────────────────────────────────────────
const map = L.map('map',{
  zoomControl:true,
  attributionControl:false,
  zoomSnap:0.25,           // permite zooms fraccionarios (0.25, 0.5, 0.75…)
  zoomDelta:0.25,          // cada +/- del control suma/resta 0.25
  wheelPxPerZoomLevel:120  // rueda de ratón también más suave
}).setView([41.7,-1.1],9);
// Sin capa base — sólo se ven los polígonos de los muns sobre fondo neutro.
const capaMuns = L.layerGroup().addTo(map);
const capaParques = L.layerGroup().addTo(map);
const capaLbls = L.layerGroup().addTo(map);
// Capa de "foco": resalta un municipio seleccionado, sus líneas hacia los
// parques que lo cubren (asignado + cerrados que podrían cubrirlo), y un
// popup detallado con todos los parques y tiempos.
const capaFoco = L.layerGroup().addTo(map);
// Capa de marcas de empresas (principales empresas ubicadas FUERA de la capital).
// Pane propio por encima de los rellenos de municipio para que destaquen.
map.createPane('empresasPane'); map.getPane('empresasPane').style.zIndex = 655;

// ─── Utilidades ────────────────────────────────────────────────
function colorTiempo(min){
  const g = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  if(min<=15) return g('--v');
  if(min<=35) return g('--a');
  if(min<=45) return g('--n');
  if(min<=55) return g('--r');
  return g('--k');
}
const COL_GRIS = '#95a5a6';

// Devuelve el primer parque de la lista ordenada por tiempo que tenga bomberos>0
function parqueAsignado(mun){
  const m = DATOS.muns[mun];
  if(!m || !m.parques || !m.parques.length) return null;
  for(const [p,t] of m.parques){
    if((bomberos[p]||0) > 0) return {parque:p, min:t};
  }
  return null;
}

// ─── Panel lateral ─────────────────────────────────────────────
function renderPanel(){
  const cont = document.getElementById('parques-lista');
  cont.innerHTML = '';
  const orden = Object.keys(BOMBEROS_DEFAULT); // orden fijo del listado
  orden.forEach(p=>{
    const n = bomberos[p]||0;
    const cerrado = n<=0;
    const col = PARQUE_COLOR[p] || '#666';
    // Contadores para este parque
    let numMuns=0, sup=0, pob=0;
    Object.entries(DATOS.muns).forEach(([mun,mv])=>{
      const asig = parqueAsignado(mun);
      if(asig && asig.parque===p){ numMuns++; sup+=mv.sup_km2; pob+=mv.pob; }
    });
    const div = document.createElement('div');
    div.className = 'parque' + (cerrado?' cerrado':'');
    div.innerHTML =
      '<div class="parque-cab">'+
        '<span class="dot" style="background:'+col+'"></span>'+
        '<span class="parque-nom">'+p+'</span>'+
        '<div class="bom-ctrl">'+
          '<button onclick="ajustar(\''+p.replace(/\'/g,"\\'")+'\', -1)">−</button>'+
          '<input type="number" min="0" value="'+n+'" onchange="setBom(\''+p.replace(/\'/g,"\\'")+'\', this.value)">'+
          '<button onclick="ajustar(\''+p.replace(/\'/g,"\\'")+'\', +1)">+</button>'+
        '</div>'+
      '</div>'+
      (cerrado
        ? '<div class="stats" style="color:#c0392b;font-weight:800">⚠ Parque cerrado — sin cobertura asignada</div>'
        : '<div class="stats">'+
            '<span class="bom-ico">🧑‍🚒</span><b>'+numMuns+'</b> muns · <b>'+sup.toFixed(0)+'</b> km² · <b>'+pob.toLocaleString('es-ES')+'</b> hab'+
          '</div>');
    cont.appendChild(div);
  });
  actualizarTotales();
}

function actualizarTotales(){
  const t = document.getElementById('totales');
  let cub=0, ncub=0, pobCub=0, pobNo=0, supCub=0, supNo=0;
  Object.entries(DATOS.muns).forEach(([mun,mv])=>{
    if(parqueAsignado(mun)){ cub++; pobCub+=mv.pob; supCub+=mv.sup_km2; }
    else { ncub++; pobNo+=mv.pob; supNo+=mv.sup_km2; }
  });
  t.innerHTML = 'Cobertura: <b>'+cub+'</b> muns / '+(cub+ncub)+' — <b>'+pobCub.toLocaleString('es-ES')+'</b> hab cubiertos'+
    (ncub>0 ? '<br>⚠ <b>'+ncub+'</b> muns sin cobertura ('+pobNo.toLocaleString('es-ES')+' hab)' : '');
}

function ajustar(p, d){ setBom(p, (bomberos[p]||0) + d); }
function setBom(p, v){
  v = Math.max(0, parseInt(v)||0);
  bomberos[p] = v;
  refrescar();
}
function resetear(){ bomberos = {...BOMBEROS_DEFAULT}; refrescar(); }
function setModo(m){
  modo = m;
  document.getElementById('tab-tiempos').classList.toggle('on', m==='tiempos');
  document.getElementById('tab-isocronas').classList.toggle('on', m==='isocronas');
  if(m!=='isocronas' && _zonaParque) desactivarZona(false);
  const be=document.getElementById('btn-empresas');
  if(be){ be.disabled = (m!=='tiempos'); be.title = (m!=='tiempos')
    ? 'Disponible solo en modo Tiempos mínimos' : 'Muestra las principales empresas ubicadas fuera de la capital'; }
  renderLeyendaMapa();
  refrescar();
}
function renderLeyendaMapa(){
  const cont = document.getElementById('legend-map');
  if(!cont) return;
  if(modo==='tiempos'){
    cont.innerHTML =
      '<div class="titulo">TIEMPO DE LLEGADA</div>'+
      '<div class="fila"><span class="caja" style="background:var(--v)"></span>0 – 15 min</div>'+
      '<div class="fila"><span class="caja" style="background:var(--a)"></span>15 – 35 min</div>'+
      '<div class="fila"><span class="caja" style="background:var(--n)"></span>35 – 45 min</div>'+
      '<div class="fila"><span class="caja" style="background:var(--r)"></span>45 – 55 min</div>'+
      '<div class="fila"><span class="caja" style="background:var(--k)"></span>&gt; 55 min</div>';
  } else {
    // Modo Isócronas: leyenda con los parques y sus colores (solo los abiertos)

    Object.keys(DATOS.parques).forEach(p=>{
      const abierto = (bomberos[p]||0) > 0;
      const col = PARQUE_COLOR[p] || '#888';
      html += '<div class="fila" style="'+(abierto?'':'opacity:.35')+'"><span class="caja" style="background:'+col+'"></span>'+p+(abierto?'':' (cerrado)')+'</div>';

    cont.innerHTML = html;
  }
}

// ─── Render mapa ───────────────────────────────────────────────
function renderMuns(){
  capaMuns.clearLayers();
  Object.entries(DATOS.muns).forEach(([mun, mv])=>{
    if(!mv.poligonos || !mv.poligonos.length) return;
    const asig = parqueAsignado(mun);
    let col;
    if(!asig) col = COL_GRIS;
    else if(modo==='isocronas') col = PARQUE_COLOR[asig.parque] || '#888';
    else col = colorTiempo(asig.min);
    mv.poligonos.forEach(poly=>{
      if(!poly || poly.length<3) return;
      L.polygon(poly,{
        color:'#1a1a1a', weight:0.8, opacity:0.9,
        fillColor:col, fillOpacity:1, interactive:true
      }).bindTooltip(
        '<b>'+mun+'</b><br>'+
        (asig ? asig.parque+' · '+asig.min.toFixed(1)+' min' : '<span style="color:#c0392b">SIN COBERTURA</span>')+
        '<br>Pob: '+mv.pob.toLocaleString('es-ES')+' hab · '+mv.sup_km2.toFixed(1)+' km²',
        {sticky:true}
      ).on('click', ()=>{ if(_zonaParque && _zonaAdded.has(mun)) focoMunZona(mun); else focoMun(mun); }).addTo(capaMuns);
    });
  });
}

function renderParques(){
  capaParques.clearLayers();
  capaLbls.clearLayers();
  Object.entries(DATOS.parques).forEach(([p, pv])=>{
    const n = bomberos[p]||0;
    const col = PARQUE_COLOR[p] || '#666';
    const cerrado = n<=0;
    // Contadores actuales
    let numMuns=0, sup=0, pob=0;
    Object.entries(DATOS.muns).forEach(([mun,mv])=>{
      const asig = parqueAsignado(mun);
      if(asig && asig.parque===p){ numMuns++; sup+=mv.sup_km2; pob+=mv.pob; }
    });
    // Icono círculo del parque. Cerrado = hazard amarillo con borde negro
    // más grueso y radio mayor (para destacar sobre el mapa que ese parque
    // no atiende cobertura).
    L.circleMarker([pv.lat, pv.lon],{
      radius:cerrado?12:10,
      color:cerrado?'#ffdd00':'#1a1a1a',
      fillColor:cerrado?'#000':col,
      fillOpacity:1,
      weight:cerrado?4:2.5,
      interactive: modo==='isocronas'
    }).on('click', ()=>toggleZonaParque(p)).addTo(capaParques);
    // Etiqueta flotante semitransparente: si cerrado, sólo nombre + sello CERRADO
    // (no se muestran muns/km²/hab porque no atiende cobertura).
    let cuerpo;
    if(cerrado){
      cuerpo = '<div class="p-nom">'+p+'</div>'+
               '<div class="p-boms">CERRADO</div>';
    } else {
      cuerpo = '<div class="p-nom">'+p+'</div>'+
               '<div class="p-boms">'+'🧑‍🚒'.repeat(Math.min(n,10))+'</div>'+
               '<div class="p-stat"><b>'+numMuns+'</b> muns · <b>'+sup.toFixed(0)+'</b> km²</div>'+
               '<div class="p-stat"><b>'+pob.toLocaleString('es-ES')+'</b> hab</div>';
    }
    // Anchor específico por parque (esquina del icono que coincide con el
    // punto real del parque). Por defecto va la esquina sup-izq desplazada
    // 14 px hacia arriba (etiqueta abajo-derecha del círculo).
    // - Calatayud: esquina inf-derecha coincide con el círculo (etiqueta
    //   queda arriba-izquierda).
    // - La Almunia: esquina inf-izquierda coincide con el círculo (etiqueta
    //   queda arriba-derecha).
    const ANCHORS = {
      'Calatayud':                    [110, 78],  // inf-dcha coincide → etiq arriba-izq
      'La Almunia de Doña Godina':    [56, 78],   // inf-izq desplazada ~1/2 a la izq
      'Ejea de los Caballeros':       [0, 78],    // inf-izq coincide → etiq arriba-dcha
      'Tarazona':                     [110, 0],   // sup-dcha coincide → etiq abajo-izq
      'El Burgo de Ebro':             [0, 78],    // inf-izq coincide → etiq arriba-dcha
      'Tauste':                       [0, 39],    // mitad-izq coincide → etiq a la dcha
    };
    const anchor = ANCHORS[p] || [0, -14];
    const clk = (modo==='isocronas');
    L.marker([pv.lat, pv.lon],{icon:L.divIcon({className:'',
      html:'<div class="lbl-parque'+(cerrado?' cerrado':'')+(clk?' clk':'')+(_zonaParque===p?' zona-activo':'')+'">'+cuerpo+'</div>',
      iconSize:null, iconAnchor:anchor}), interactive:clk, zIndexOffset:1000
    }).on('click', ()=>toggleZonaParque(p)).addTo(capaLbls);
  });
}

// ─── Marcas de empresas (fuera de la capital) ──────────────────
// Dibuja una marca magenta por empresa, agrupadas por municipio. Cuando hay
// varias en el mismo municipio se reparten en un pequeño anillo alrededor del
// punto del municipio para que no se solapen. Solo en modo Tiempos mínimos.
function renderEmpresas(){
  capaEmpresas.clearLayers();
  if(!mostrarEmpresas || modo!=='tiempos' || !EMPRESAS || !DATOS) return;
  const porMun = {};
  EMPRESAS.forEach(e=>{ (porMun[e.municipio]=porMun[e.municipio]||[]).push(e); });
  Object.entries(porMun).forEach(([mun, lst])=>{
    const mv = DATOS.muns[mun];
    if(!mv || mv.lat==null || mv.lon==null) return;
    const cx = mv.lat, cy = mv.lon, k = lst.length;
    const R = Math.min(0.011, 0.0032 + 0.0011*k);   // radio del anillo (grados)
    lst.forEach((e, i)=>{
      let lat = cx, lon = cy;
      if(k>1){
        const ang = (2*Math.PI*i)/k - Math.PI/2;
        lat = cx + R*Math.sin(ang)*0.72;            // achatado en latitud
        lon = cy + R*Math.cos(ang);
      }
      const tip = '<b>'+e.nombre+'</b><br><span style="color:#555">'+mun+'</span>'+
        (e.ubicacion?'<br><span style="font-size:11px;color:#777">'+e.ubicacion+'</span>':'');
      L.marker([lat,lon],{
        pane:'empresasPane', zIndexOffset:3000,
        icon:L.divIcon({className:'', iconSize:[19,19], iconAnchor:[9,9], html:'<div class="emp-mark"></div>'})
      }).bindTooltip(tip,{direction:'top',offset:[0,-9],className:'emp-tip',sticky:true})
        .on('click', ()=>focoMun(mun, e.nombre))
        .addTo(capaEmpresas);
    });
  });
}
function toggleEmpresas(){
  if(modo!=='tiempos') return;
  mostrarEmpresas = !mostrarEmpresas;
  const b=document.getElementById('btn-empresas'); if(b) b.classList.toggle('on', mostrarEmpresas);
  renderEmpresas();
}

// Panel "Municipios peor cubiertos" — TOP 10 por franja de tiempo, ordenados
// por población descendente dentro de cada franja. Sirve para identificar
// rápidamente qué núcleos poblados están peor atendidos según la configuración
// actual de dotaciones (útil al cerrar/abrir parques).
function renderPeorCubiertos(){
  const cont = document.getElementById('peor-cubiertos');
  if(!cont) return;
  const franjas = [
    {k:'k', min:55, max:Infinity, label:'> 55 min'},
    {k:'r', min:45, max:55,        label:'45 – 55 min'},
    {k:'n', min:35, max:45,        label:'35 – 45 min'},
  ];
  // Clasificar cada mun en su franja según tiempo del parque asignado.
  // Los "sin cobertura" (sin parque abierto que llegue) se agrupan aparte.
  const buckets = franjas.map(f=>({...f, muns:[]}));
  const sinCob = [];
  Object.entries(DATOS.muns).forEach(([mun, mv])=>{
    const asig = parqueAsignado(mun);
    if(!asig){ sinCob.push({mun, pob:mv.pob, sup:mv.sup_km2}); return; }
    for(const b of buckets){
      // (min, max] para no solaparse: >35 y ≤45 en franja "n", etc.
      // Para la franja >55 usamos > estrictamente.
      if(b.max===Infinity && asig.min>b.min){
        b.muns.push({mun, pob:mv.pob, min:asig.min, parque:asig.parque}); break;
      }
      if(b.max!==Infinity && asig.min>b.min && asig.min<=b.max){
        b.muns.push({mun, pob:mv.pob, min:asig.min, parque:asig.parque}); break;
      }
    }
  });
  let html = '<h2>🚨 Municipios peor cubiertos (TOP 10 por población)</h2>';
  // Franja "sin cobertura" primero si hay muns cuando algún parque está cerrado.
  if(sinCob.length){
    sinCob.sort((a,b)=>b.pob-a.pob);
    const top = sinCob.slice(0,10);
    html += '<div class="franja">'+
      '<div class="franja-cab g">Sin cobertura <span class="n-muns">'+sinCob.length+' mun · '+sinCob.reduce((s,x)=>s+x.pob,0).toLocaleString('es-ES')+' hab</span></div>'+
      '<ul>'+top.map(x=>'<li data-mun="'+x.mun.replace(/"/g,'&quot;')+'" onclick="focoMun(\''+x.mun.replace(/\'/g,"\\'")+'\')"><span class="nom">'+x.mun+'</span><span class="pob">'+x.pob.toLocaleString('es-ES')+' hab</span></li>').join('')+'</ul>'+
      '</div>';
  }
  buckets.forEach(b=>{
    b.muns.sort((a,b)=>b.pob-a.pob);
    const top = b.muns.slice(0,10);
    const totalPob = b.muns.reduce((s,x)=>s+x.pob,0);
    html += '<div class="franja">'+
      '<div class="franja-cab '+b.k+'">'+b.label+' <span class="n-muns">'+b.muns.length+' mun · '+totalPob.toLocaleString('es-ES')+' hab</span></div>';
    if(top.length){
      html += '<ul>'+top.map(x=>
        '<li data-mun="'+x.mun.replace(/"/g,'&quot;')+'" onclick="focoMun(\''+x.mun.replace(/\'/g,"\\'")+'\')">'+
        '<span class="nom">'+x.mun+'</span>'+
        '<span class="pob">'+x.pob.toLocaleString('es-ES')+' hab</span>'+
        '<span class="t">'+Math.round(x.min)+' min</span></li>'
      ).join('')+'</ul>';
    } else {
      html += '<div class="vacio">— ninguno —</div>';
    }
    html += '</div>';
  });
  cont.innerHTML = html;
  // Marca visualmente el municipio actualmente enfocado si sigue en el listado
  if(_munEnfocado){
    cont.querySelectorAll('.franja li').forEach(li=>{
      if(li.dataset.mun === _munEnfocado) li.classList.add('activo');
    });
  }
}

// ─── Foco de un municipio en el mapa ─────────────────────────
// Resalta el mun clicado (borde grueso), traza líneas al parque asignado
// (verde) y a los parques cerrados que podrían cubrirlo (amarillo hazard
// discontinuo), y abre un popup con el detalle de todos los parques que
// atienden el municipio y sus tiempos, coloreado según franja de tiempo.
function focoMun(mun, empresa){
  const mv = DATOS.muns[mun];
  if(!mv || !mv.parques || !mv.parques.length){ return; }
  _munEnfocado = mun;
  capaFoco.clearLayers();

  // 1) Contorno del mun: tres capas superpuestas:
  //    - Relleno amarillo muy tenue para que el interior brille sin ocultar el color de franja.
  //    - Halo negro grueso continuo (perfila el borde).
  //    - Rayas amarillas gruesas encima con animación "marching ants" (CSS)
  //      para que el perímetro se lea como cinta hazard en movimiento.
  let bounds = null;
  (mv.poligonos||[]).forEach(poly=>{
    if(!poly || poly.length<3) return;
    L.polygon(poly,{className:'foco-perim-interior', interactive:false}).addTo(capaFoco);
    L.polygon(poly,{className:'foco-perim-halo',     interactive:false}).addTo(capaFoco);
    const p = L.polygon(poly,{className:'foco-perim-rayas', interactive:false}).addTo(capaFoco);
    if(!bounds) bounds = p.getBounds(); else bounds.extend(p.getBounds());
  });
  const centro = bounds ? bounds.getCenter() : (mv.centroide ? L.latLng(mv.centroide[0], mv.centroide[1]) : null);
  if(!centro) return;

  // 2) Estado de cada parque de la lista, filtrado a lo relevante:
  //    - el parque asignado ahora (el que cubre según situación actual), y
  //    - los parques CERRADOS cuyo tiempo sería MENOR que el del asignado
  //      (si estuvieran abiertos cubrirían antes → interesa mostrarlos como
  //      "recuperación potencial de tiempo si se reabren").
  //    Los abiertos no asignados (más lentos) y los cerrados más lentos que
  //    el asignado NO aparecen: no aportan al análisis.
  const asig = parqueAsignado(mun);
  const tAsig = asig ? asig.min : Infinity;
  const filas = mv.parques
    .map(([p,t])=>{
      const abierto = (bomberos[p]||0) > 0;
      const esAsig = asig && asig.parque === p;
      return {p, t, abierto, esAsig, boms:bomberos[p]||0};
    })
    .filter(f => f.esAsig || (!f.abierto && f.t < tAsig));

  // 3) Líneas hacia los parques mostrados en el popup (asignado + cerrados
  //    más rápidos que el actual).
  filas.forEach(f=>{
    const pv = DATOS.parques[f.p];
    if(!pv) return;
    const dest = L.latLng(pv.lat, pv.lon);
    if(f.esAsig){
      // Línea gruesa hacia el parque que cubre: color del tiempo de llegada
      // (misma paleta de franjas), con halo negro exterior para contraste.
      const colAsig = asig ? colorTiempo(asig.min) : '#2ecc71';
      L.polyline([centro, dest],{color:'#000',    weight:7, opacity:0.75, interactive:false}).addTo(capaFoco);
      L.polyline([centro, dest],{color:colAsig,   weight:4.5, opacity:1,  interactive:false}).addTo(capaFoco);
      L.circleMarker(dest,{radius:15, color:'#000', fillColor:colAsig, fillOpacity:0.35, weight:3, interactive:false}).addTo(capaFoco);
    } else {
      // f.abierto===false y f.t < tAsig: cerrado que mejoraría el tiempo.
      L.polyline([centro, dest],{color:'#000', weight:5, opacity:0.6, interactive:false, dashArray:'2 6'}).addTo(capaFoco);
      L.polyline([centro, dest],{color:'#ffdd00', weight:3, opacity:1, interactive:false, dashArray:'8 6'}).addTo(capaFoco);
      L.circleMarker(dest,{radius:14, color:'#ffdd00', fillColor:'#000', fillOpacity:0.35, weight:3, interactive:false}).addTo(capaFoco);
    }
  });

  const colFranja = asig ? colorTiempo(asig.min) : '#95a5a6';
  // Texto negro sobre franja amarilla (15-35 min); blanco en el resto.
  const claroCubre = asig && asig.min > 15 && asig.min <= 35;
  const colCubreTxt = claroCubre ? '#000' : '#fff';
  const filasHtml = filas.map(f=>{
    const cls = f.esAsig ? 'asig' : (f.abierto ? '' : 'cer');
    const est = f.esAsig
      ? '<span class="p-est asig" style="background:'+colFranja+';color:'+colCubreTxt+'">✓ CUBRE</span>'
      : (f.abierto ? '<span class="p-est ab">abierto</span>' : '<span class="p-est cer">CERRADO</span>');
    return '<tr class="'+cls+'"><td class="p-nom">'+f.p+'</td><td>'+est+'</td><td class="p-min">'+f.t.toFixed(1)+' min</td></tr>';
  }).join('');
  const tiempoTxt = asig ? asig.min.toFixed(1)+' min → '+asig.parque : 'SIN COBERTURA';
  // Fondo amarillo (franja 15-35 min) → texto negro para contraste.
  const claro = asig && asig.min > 15 && asig.min <= 35;
  const empBand = empresa ? '<div class="emp-cab">🏭 '+empresa+'</div>' : '';
  const cabRad = empresa ? 'border-radius:0;' : '';
  const html =
    '<div class="foco-popup">'+
      empBand+
      '<div class="cab'+(claro?' claro':'')+'" style="'+cabRad+'background:'+colFranja+'">'+
        '<div class="n">'+mun+'</div>'+
        '<div class="p">'+mv.pob.toLocaleString('es-ES')+' hab · '+mv.sup_km2.toFixed(1)+' km² · '+tiempoTxt+'</div>'+
      '</div>'+
      '<table>'+filasHtml+'</table>'+
      '<div class="cerrar" onclick="limpiarFoco()">× cerrar</div>'+
    '</div>';
  // 5) Encuadrar mun + parques relacionados PRIMERO (síncrono) para tener
  //    posiciones en píxeles estables antes de posicionar el popup.
  const puntosMapa = [centro];
  filas.forEach(f=>{
    const pv = DATOS.parques[f.p];
    if(pv) puntosMapa.push([pv.lat, pv.lon]);
  });
  if(puntosMapa.length>1){
    map.fitBounds(L.latLngBounds(puntosMapa).pad(0.35), {maxZoom:11, animate:false});
  }

  // 6) Colocar el popup en el ÁNGULO MÁS GRANDE formado entre las líneas
  //    mun→parque (para no cruzarse jamás con ninguna). Si hay N parques,
  //    dividen el círculo en N sectores; se elige el bisector del sector
  //    mayor. Si hay 1 parque, se coloca en el sentido opuesto (sector 360°).
  const popW = 260;
  const popH = 55 + filas.length*32 + 32 + (empresa?30:0);  // cab + filas + cerrar (+ banda empresa)
  const OFF_RADIUS = 130;                  // distancia centro-popup ↔ centro-mun (px)
  const cxPt = map.latLngToContainerPoint(centro);
  // Bearings (radianes) de cada parque desde el mun, en coordenadas de pantalla
  // (y crece hacia abajo; atan2 devuelve entre -π y +π).
  const bearings = filas.map(f=>{
    const pv = DATOS.parques[f.p]; if(!pv) return null;
    const pp = map.latLngToContainerPoint([pv.lat, pv.lon]);
    return Math.atan2(pp.y - cxPt.y, pp.x - cxPt.x);
  }).filter(b=>b!==null).sort((a,b)=>a-b);
  let bestMid;
  if(bearings.length === 1){
    // Popup en dirección opuesta al único parque
    bestMid = bearings[0] + Math.PI;
  } else {
    let bestGap = 0;
    for(let i=0; i<bearings.length; i++){
      const cur = bearings[i];
      const nxt = bearings[(i+1) % bearings.length];
      let gap = nxt - cur;
      if(i === bearings.length-1) gap += 2*Math.PI; // wrap-around
      if(gap > bestGap){
        bestGap = gap;
        bestMid = cur + gap/2;
      }
    }
  }
  // Normalizar a [-π, π]
  while(bestMid >  Math.PI) bestMid -= 2*Math.PI;
  while(bestMid < -Math.PI) bestMid += 2*Math.PI;
  const dirVec = {x: Math.cos(bestMid), y: Math.sin(bestMid)};
  const offX = dirVec.x * OFF_RADIUS;
  const offY = dirVec.y * OFF_RADIUS;
  // Ancla del popup = latLng+offset (Leaflet). Con ancla default (bottom-center)
  // el popup se despliega hacia arriba; para centrarlo en (offX, offY) hay que
  // desplazar el ancla popH/2 hacia abajo desde el centro geométrico deseado.
  const cfg = {
    off: L.point(offX, offY + popH/2),
    // Vector desde el CENTRO del popup hacia el mun (para calcular el punto
    // de unión en el centro del lado más cercano).
    dirBack: {x:-dirVec.x, y:-dirVec.y},
    popW, popH,
  };
  // Punto de unión: centro del LADO del popup más cercano al mun, calculado
  // según el eje dominante del vector popup→mun.
  function calcExt(cfg, cxPt){
    const cpx = cxPt.x + cfg.off.x;
    const cpy = cxPt.y + cfg.off.y - cfg.popH/2; // centro geométrico del popup
    const halfW = cfg.popW/2, halfH = cfg.popH/2;
    const {x:dx, y:dy} = cfg.dirBack;
    let sx, sy;
    if(Math.abs(dx) * halfH > Math.abs(dy) * halfW){
      // vector predominantemente horizontal → lado vertical más cercano
      sx = cpx + Math.sign(dx) * halfW;
      sy = cpy;
    } else {
      // vector predominantemente vertical → lado horizontal más cercano
      sx = cpx;
      sy = cpy + Math.sign(dy) * halfH;
    }
    return L.point(sx, sy);
  }
  const extPt = calcExt(cfg, cxPt);
  const extLL = map.containerPointToLatLng(extPt);
  // Línea de unión mun ↔ popup: marrón chocolate con halo dorado exterior.
  // Se guarda referencia + configuración para redibujar dinámicamente en
  // eventos zoom/move (así el extremo queda SIEMPRE clavado sobre el centro
  // del lado del popup más cercano al mun, aunque el usuario haga zoom).
  _focoCfg = {centro, cfg};
  _focoLineaHalo = L.polyline([centro, extLL],{color:'#c9a24b', weight:7, opacity:0.95, interactive:false, lineCap:'round'}).addTo(capaFoco);
  _focoLineaBody = L.polyline([centro, extLL],{color:'#5c3a0e', weight:4, opacity:1,    interactive:false, lineCap:'round'}).addTo(capaFoco);
  _focoPunto     = L.circleMarker(extLL,{radius:6, color:'#c9a24b', fillColor:'#5c3a0e', fillOpacity:1, weight:2.5, interactive:false}).addTo(capaFoco);
  // Popup con offset. Anclado por su borde inferior-centro (default).
  _focoPopup = L.popup({maxWidth:370, minWidth:230, autoPan:false, closeButton:false, className:'foco-popup-wrap', offset:cfg.off})
    .setLatLng(centro).setContent(html).openOn(map);
  // Activar drag sobre la cabecera del popup: al soltar, la línea de unión
  // se recalcula al nuevo lado más cercano del popup.
  _activarDragPopup();
  // Resaltar la etiqueta del parque que cubre con borde triple negro-color-negro.
  // Limpia cualquier resalto anterior antes de aplicar el nuevo.
  document.querySelectorAll('.lbl-parque.cubre').forEach(el=>{
    el.classList.remove('cubre'); el.style.removeProperty('--cub-col');
  });
  if(asig){
    document.querySelectorAll('.lbl-parque').forEach(el=>{
      const nom = el.querySelector('.p-nom');
      if(nom && nom.textContent.trim() === asig.parque){
        el.classList.add('cubre');
        el.style.setProperty('--cub-col', colFranja);
      }
    });
  }
  // Marca el li en el panel
  document.querySelectorAll('.franja li.activo').forEach(el=>el.classList.remove('activo'));
  document.querySelectorAll('.franja li').forEach(el=>{
    if(el.dataset.mun === mun) el.classList.add('activo');
  });
}

function limpiarFoco(){
  _munEnfocado = null;
  _focoCfg = null;
  _focoLineaHalo = _focoLineaBody = _focoPunto = null;
  _focoPopup = null;
  _focoDrag = null;
  if(map.dragging && !map.dragging.enabled()) map.dragging.enable();
  capaFoco.clearLayers();
  map.closePopup();
  document.querySelectorAll('.franja li.activo').forEach(el=>el.classList.remove('activo'));
  document.querySelectorAll('.lbl-parque.cubre').forEach(el=>{
    el.classList.remove('cubre'); el.style.removeProperty('--cub-col');
  });
}

// Redibuja la línea de unión mun↔popup en cada zoom/move: el punto de unión
// se recalcula en píxeles con el offset guardado, así queda anclado sobre el
// centro del lado del popup más cercano al mun independientemente del zoom.
function _actualizarLineaFoco(){
  if(!_focoCfg || !_focoLineaHalo) return;
  const cfg = _focoCfg.cfg;
  const cxPt = map.latLngToContainerPoint(_focoCfg.centro);
  // Centro geométrico del popup en píxeles (según offset actual y zoom).
  const cpx = cxPt.x + cfg.off.x;
  const cpy = cxPt.y + cfg.off.y - cfg.popH/2;
  // Vector desde el centro del popup hacia el mun (dinámico: depende de la
  // posición actual del popup, no de un dirBack precalculado). Al arrastrar
  // el popup, el vector cambia y con él el "lado más cercano" al mun.
  const dx = cxPt.x - cpx;
  const dy = cxPt.y - cpy;
  const halfW = cfg.popW/2, halfH = cfg.popH/2;
  let sx, sy;
  if(Math.abs(dx) * halfH > Math.abs(dy) * halfW){
    sx = cpx + Math.sign(dx) * halfW; sy = cpy;
  } else {
    sx = cpx;                         sy = cpy + Math.sign(dy) * halfH;
  }
  const extLL = map.containerPointToLatLng(L.point(sx, sy));
  _focoLineaHalo.setLatLngs([_focoCfg.centro, extLL]);
  _focoLineaBody.setLatLngs([_focoCfg.centro, extLL]);
  _focoPunto.setLatLng(extLL);
}
map.on('zoomend moveend zoom', _actualizarLineaFoco);

// Convierte la cabecera del popup en asa de arrastre: al mousedown captura
// posición inicial, al mousemove global desplaza el offset del popup y llama
// a _actualizarLineaFoco (que recalcula el lado más cercano); al mouseup libera.
function _activarDragPopup(){
  if(!_focoPopup || !_focoCfg) return;
  const cont = _focoPopup.getElement();
  if(!cont) return;
  const cab = cont.querySelector('.foco-popup .cab');
  if(!cab) return;
  cab.addEventListener('mousedown', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    map.dragging.disable();
    _focoDrag = {
      startX: ev.clientX,
      startY: ev.clientY,
      startOffX: _focoCfg.cfg.off.x,
      startOffY: _focoCfg.cfg.off.y,
    };
  });
  cab.addEventListener('touchstart', ev=>{
    if(!ev.touches.length) return;
    ev.preventDefault(); ev.stopPropagation();
    map.dragging.disable();
    const t = ev.touches[0];
    _focoDrag = {
      startX: t.clientX,
      startY: t.clientY,
      startOffX: _focoCfg.cfg.off.x,
      startOffY: _focoCfg.cfg.off.y,
    };
  }, {passive:false});
}
document.addEventListener('mousemove', ev=>{
  if(!_focoDrag || !_focoCfg || !_focoPopup) return;
  const dx = ev.clientX - _focoDrag.startX;
  const dy = ev.clientY - _focoDrag.startY;
  _focoCfg.cfg.off = L.point(_focoDrag.startOffX + dx, _focoDrag.startOffY + dy);
  _focoPopup.options.offset = _focoCfg.cfg.off;
  _focoPopup.update();
  _actualizarLineaFoco();
});
document.addEventListener('touchmove', ev=>{
  if(!_focoDrag || !_focoCfg || !_focoPopup || !ev.touches.length) return;
  const t = ev.touches[0];
  const dx = t.clientX - _focoDrag.startX;
  const dy = t.clientY - _focoDrag.startY;
  _focoCfg.cfg.off = L.point(_focoDrag.startOffX + dx, _focoDrag.startOffY + dy);
  _focoPopup.options.offset = _focoCfg.cfg.off;
  _focoPopup.update();
  _actualizarLineaFoco();
}, {passive:false});
function _endDragFoco(){
  if(!_focoDrag) return;
  _focoDrag = null;
  map.dragging.enable();
}
document.addEventListener('mouseup', _endDragFoco);
document.addEventListener('touchend', _endDragFoco);
document.addEventListener('touchcancel', _endDragFoco);

// ─── Zona de cobertura ampliada (modo isócronas) ──────────────
// Al pulsar la etiqueta/círculo de un parque ABIERTO, se resalta la zona que ese
// parque ha ABSORBIDO por el cierre de otros (municipios cuyo parque más rápido
// —con todo abierto— está cerrado y ahora cubre este). Se dibuja el perímetro de
// esa zona añadida como cinta hazard blanca/negra móvil, se hace zoom a toda la
// cobertura actual del parque y se muestra un panel con los datos AÑADIDOS.
let _zonaParque=null, _zonaAdded=new Set(), _zonaPrevView=null, _zonaMunSel=null;
const capaZona    = L.layerGroup().addTo(map);   // perímetro + relleno de la zona
const capaZonaMun = L.layerGroup().addTo(map);   // resalte + cartel del mun absorbido

// Parque más rápido de un mun con TODO abierto (situación base, sin cierres).
function baselineParque(mun){
  const m=DATOS.muns[mun];
  return (m && m.parques && m.parques.length) ? m.parques[0][0] : null;
}
// Municipios que P cubre AHORA pero que en la situación base cubriría otro parque
// (los ha absorbido por cierres).
function calcAdded(P){
  const s=new Set();
  Object.keys(DATOS.muns).forEach(mun=>{
    const asig=parqueAsignado(mun);
    if(asig && asig.parque===P && baselineParque(mun)!==P) s.add(mun);
  });
  return s;
}
function toggleZonaParque(P){
  if(modo!=='isocronas') return;
  if(_zonaParque===P){ desactivarZona(true); return; }   // mismo parque → desactivar
  if((bomberos[P]||0)<=0) return;                          // parque cerrado: no cubre nada
  activarZona(P);
}
function activarZona(P){
  if(!_zonaParque) _zonaPrevView={center:map.getCenter(), zoom:map.getZoom()};
  _zonaParque=P; _zonaAdded=calcAdded(P); _zonaMunSel=null;
  capaZonaMun.clearLayers();
  dibujarZona();
  renderPanelZona();
  marcarParqueActivo();
  // Zoom a TODA la cobertura actual del parque (zona normal + añadida)
  const b=L.latLngBounds();
  Object.keys(DATOS.muns).forEach(mun=>{
    const asig=parqueAsignado(mun);
    if(asig && asig.parque===P) (DATOS.muns[mun].poligonos||[]).forEach(poly=>poly.forEach(pt=>b.extend(pt)));
  });
  if(b.isValid()) map.fitBounds(b.pad(0.12), {animate:true});
}
function desactivarZona(restore){
  const prev=_zonaPrevView;
  _zonaParque=null; _zonaAdded=new Set(); _zonaMunSel=null; _zonaPrevView=null;
  capaZona.clearLayers(); capaZonaMun.clearLayers();
  const p=document.getElementById('zona-panel'); if(p) p.remove();
  marcarParqueActivo();
  if(restore && prev) map.setView(prev.center, prev.zoom, {animate:true});
}
// Redibuja perímetro + relleno de la zona añadida SIN mover la vista.
function sincronizarZona(){
  if(!_zonaParque) return;
  if((bomberos[_zonaParque]||0)<=0){ desactivarZona(false); return; }
  _zonaAdded=calcAdded(_zonaParque);
  dibujarZona(); renderPanelZona(); marcarParqueActivo();
  if(_zonaMunSel){ if(_zonaAdded.has(_zonaMunSel)) focoMunZona(_zonaMunSel);
                   else { _zonaMunSel=null; capaZonaMun.clearLayers(); } }
}
function dibujarZona(){
  capaZona.clearLayers();
  const polys=[];
  _zonaAdded.forEach(mun=>{
    (DATOS.muns[mun].poligonos||[]).forEach(poly=>{
      if(poly && poly.length>=3){
        polys.push(poly);
        L.polygon(poly,{className:'zona-fill', interactive:false}).addTo(capaZona);
      }
    });
  });
  // Perímetro EXTERIOR de la zona: unión REAL de los polígonos (polygon-clipping)
  // para que NO aparezca ningún borde interno entre municipios. Cada anillo
  // resultante (contorno exterior y huecos) se dibuja como un único trazo continuo.
  // Respaldo: encadenado de aristas si la librería no está disponible.
  let rings = zonaUnionRings();
  if(!rings) rings = unionRings(polys);
  rings.forEach(ring=>{
    L.polyline(ring,{className:'zona-perim-halo',  interactive:false}).addTo(capaZona);
    L.polyline(ring,{className:'zona-perim-rayas', interactive:false}).addTo(capaZona);
  });
}
// Unión real de los polígonos de los municipios añadidos. Devuelve anillos en
// [lat,lon] (contornos + huecos), o null si no hay librería / falla → respaldo.
function zonaUnionRings(){
  if(!window.polygonClipping) return null;
  // Limpia un polígono: a [lon,lat], sin puntos duplicados consecutivos, cerrado.
  const clean=p=>{
    const r=[];
    p.forEach(q=>{ const a=[q[1],q[0]]; const pr=r[r.length-1];
      if(!pr||pr[0]!==a[0]||pr[1]!==a[1]) r.push(a); });
    const f=r[0], l=r[r.length-1];
    if(f&&l&&(f[0]!==l[0]||f[1]!==l[1])) r.push([f[0],f[1]]);
    return r;
  };
  const geoms=[];
  _zonaAdded.forEach(mun=>(DATOS.muns[mun].poligonos||[]).forEach(poly=>{
    if(poly && poly.length>=3){ const r=clean(poly); if(r.length>=4) geoms.push([[r]]); }
  }));
  if(!geoms.length) return [];
  // Unión INCREMENTAL (saltando cualquier polígono que dé error → robusto).
  let acc=null;
  for(const g of geoms){
    try{ acc = acc===null ? polygonClipping.union(g) : polygonClipping.union(acc, g); }
    catch(e){ /* omitir polígono problemático */ }
  }
  if(!acc) return null;
  // Área aproximada (km²) de un anillo en [lon,lat] para filtrar micro-huecos.
  const areaKm2=r=>{ let a=0; for(let i=0;i<r.length-1;i++){ a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1]; }
    const latm=r.reduce((s,p)=>s+p[1],0)/r.length;
    return Math.abs(a)/2*110.574*111.320*Math.cos(latm*Math.PI/180); };
  const MIN_HUECO_KM2 = 0.3;   // descartar slivers entre municipios; conservar enclaves reales
  const rings=[];
  acc.forEach(poly=>{
    rings.push(poly[0].map(pt=>[pt[1],pt[0]]));                 // contorno exterior
    for(let i=1;i<poly.length;i++){                             // huecos: solo enclaves reales
      if(areaKm2(poly[i])>=MIN_HUECO_KM2) rings.push(poly[i].map(pt=>[pt[1],pt[0]]));
    }
  });
  return rings;
}
function unionRings(polys){
  const R=c=>Math.round(c[0]*1e5)/1e5+','+Math.round(c[1]*1e5)/1e5;
  const cnt=new Map(), seg=new Map();
  polys.forEach(poly=>{
    const n=poly.length;
    for(let i=0;i<n;i++){
      const a=poly[i], b=poly[(i+1)%n];
      const ka=R(a), kb=R(b);
      if(ka===kb) continue;
      const k = ka<kb ? ka+'|'+kb : kb+'|'+ka;
      cnt.set(k,(cnt.get(k)||0)+1);
      if(!seg.has(k)) seg.set(k,[a,b,ka,kb]);
    }
  });
  // Solo aristas de borde (aparecen una vez). Construir adyacencia por nodo.
  const nodePt={}, adj=new Map(), used=new Set(), bkeys=[];
  cnt.forEach((c,k)=>{ if(c===1) bkeys.push(k); });
  bkeys.forEach(k=>{
    const [a,b,ka,kb]=seg.get(k);
    nodePt[ka]=a; nodePt[kb]=b;
    if(!adj.has(ka)) adj.set(ka,[]);
    if(!adj.has(kb)) adj.set(kb,[]);
    adj.get(ka).push({k, to:kb});
    adj.get(kb).push({k, to:ka});
  });
  // Encadenar: desde cada arista no usada, caminar por nodos consumiendo aristas.
  const rings=[];
  bkeys.forEach(startK=>{
    if(used.has(startK)) return;
    const [a,b,ka,kb]=seg.get(startK);
    const ring=[nodePt[ka]];
    let cur=ka, guard=0;
    while(guard++ < 200000){
      const cand=(adj.get(cur)||[]).find(e=>!used.has(e.k));
      if(!cand) break;
      used.add(cand.k);
      ring.push(nodePt[cand.to]);
      cur=cand.to;
      if(cur===ka) break;   // anillo cerrado
    }
    if(ring.length>=2) rings.push(ring);
  });
  return rings;
}
// Hace arrastrable un panel HTML dentro de #map-wrap. Si al soltar no hubo
// desplazamiento (fue un clic), ejecuta onClick (para diferenciar mover de pulsar).
function hacerArrastrable(el, onClick){
  let dragging=false, moved=false, sx=0, sy=0, startL=0, startT=0;
  const down=e=>{
    const t=e.touches?e.touches[0]:e;
    dragging=true; moved=false; sx=t.clientX; sy=t.clientY;
    const wrap=document.getElementById('map-wrap').getBoundingClientRect();
    const r=el.getBoundingClientRect();
    startL=r.left-wrap.left; startT=r.top-wrap.top;
    el.style.left=startL+'px'; el.style.top=startT+'px'; el.style.right='auto'; el.style.transform='none';
    e.preventDefault(); e.stopPropagation();
  };
  const move=e=>{
    if(!dragging) return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    el.style.left=(startL+dx)+'px'; el.style.top=(startT+dy)+'px';
    e.preventDefault();
  };
  const up=()=>{ if(!dragging) return; dragging=false; if(!moved && onClick) onClick(); };
  el.addEventListener('mousedown',down);
  el.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move,{passive:false});
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}
function renderPanelZona(){
  let el=document.getElementById('zona-panel');
  if(!el){
    el=document.createElement('div'); el.id='zona-panel';
    document.getElementById('map-wrap').appendChild(el);
    ['wheel','dblclick'].forEach(ev=>el.addEventListener(ev, e=>e.stopPropagation()));
    hacerArrastrable(el, null);   // solo mover; se desactiva pulsando de nuevo el parque
  }
  let nm=0, pob=0, sup=0;
  _zonaAdded.forEach(mun=>{ const mv=DATOS.muns[mun]; nm++; pob+=mv.pob; sup+=mv.sup_km2; });
  const dot=bomberos[_zonaParque]||0;
  const cerrados = Object.keys(DATOS.parques).filter(p=>(bomberos[p]||0)<=0);
  const cuerpo = nm>0
    ? '<div class="met">Nuevos municipios: <b>'+nm+'</b> &middot; Extensión añadida: <b>'+sup.toFixed(0)+'</b> km²<br>'+
      'Población añadida: <b>'+pob.toLocaleString('es-ES')+'</b> hab &middot; Dotación: <b>'+dot+'</b> 🧑‍🚒</div>'+
      '<div class="motivo">Ampliación provocada por el cierre de: <b>'+(cerrados.join(', ')||'—')+'</b></div>'
    : '<div class="met">Sin ampliación: ningún parque cerrado deriva cobertura a este parque.</div>';
  el.innerHTML='<div class="in"><div class="tit">▲ '+_zonaParque+' · cobertura ampliada</div>'+cuerpo+
    '<div class="hint">Arrástralo para moverlo</div></div>';
}
function marcarParqueActivo(){
  document.querySelectorAll('.lbl-parque.zona-activo').forEach(el=>el.classList.remove('zona-activo'));
  if(!_zonaParque) return;
  document.querySelectorAll('.lbl-parque').forEach(el=>{
    const nom=el.querySelector('.p-nom');
    if(nom && nom.textContent.trim()===_zonaParque) el.classList.add('zona-activo');
  });
}
// Municipio absorbido: resaltar (opacidad) + cartel hazard con la AMPLIACIÓN de
// tiempo de llegada (tiempo actual vía este parque − tiempo base con todo abierto).
function focoMunZona(mun){
  const mv=DATOS.muns[mun]; if(!mv) return;
  _zonaMunSel=mun; capaZonaMun.clearLayers();
  let b=null;
  (mv.poligonos||[]).forEach(poly=>{
    if(poly && poly.length>=3){
      const pg=L.polygon(poly,{className:'zona-mun-hl', interactive:false}).addTo(capaZonaMun);
      b = b ? (b.extend(pg.getBounds()), b) : pg.getBounds();
    }
  });
  const asig=parqueAsignado(mun);
  const tCur = asig ? asig.min : null;
  const tBase = mv.parques[0][1];
  const dt = (tCur!=null) ? Math.max(0, tCur - tBase) : null;
  const centro = b ? b.getCenter() : L.latLng(mv.lat, mv.lon);
  const dtTxt = (dt!=null) ? ('+'+Math.round(dt)+' min') : '—';
  const totTxt = (tCur!=null) ? (Math.round(tCur)+' min') : '—';
  const html='<div class="zona-cartel" style="transform:translate(-50%,-125%)"><div class="in">'+
    '<div class="n">'+mun+'</div>'+
    '<div class="pob">'+mv.pob.toLocaleString('es-ES')+' hab · ahora lo cubre '+_zonaParque+'</div>'+
    '<div class="dt">▲ '+dtTxt+'</div>'+
    '<div class="tot">Tiempo total de llegada: <b>'+totTxt+'</b></div>'+
    '</div></div>';
  L.marker(centro,{icon:L.divIcon({className:'', html:html, iconSize:null, iconAnchor:[0,0]}),
    interactive:true, draggable:true, zIndexOffset:2000}).addTo(capaZonaMun);
}

// ─── Exportar POSTER (deshabilitado) ──────────────────────────
async function _generarPoster_deshabilitado_(){
  const btn = event.target;
  const txt = btn.textContent;
  btn.textContent = '⏳ Generando…';
  btn.disabled = true;
  try{
    const W = 1080, H = 1920;
    // Colores según tiempo (usados también en la leyenda)
    const COL = {v:'#2ecc71', a:'#f1c40f', n:'#e67e22', r:'#c0392b'};

    // Contadores por parque (bomberos, muns, sup, pob)
    const parquesInfo = {};
    Object.keys(DATOS.parques).forEach(p=>{
      parquesInfo[p] = {n:bomberos[p]||0, muns:0, sup:0, pob:0};
    });
    Object.entries(DATOS.muns).forEach(([mun,mv])=>{
      const a = parqueAsignado(mun);
      if(a && parquesInfo[a.parque]){
        parquesInfo[a.parque].muns++;
        parquesInfo[a.parque].sup += mv.sup_km2;
        parquesInfo[a.parque].pob += mv.pob;
      }
    });

    // Tarjetas independientes por parque (grid 3×3)
    const cardsHtml = Object.entries(DATOS.parques).map(([p,pv])=>{
      const info = parquesInfo[p];
      const cerrado = info.n <= 0;
      const bomIco = cerrado
        ? '<div style="color:#b31f26;font-weight:900;font-size:16px;letter-spacing:.05em;border:3px solid #b31f26;padding:3px 8px;border-radius:6px;display:inline-block;transform:rotate(-6deg)">CERRADO</div>'
        : '<div style="font-size:26px;line-height:1;letter-spacing:-3px">'+ '🚒'.repeat(Math.min(info.n,8)) +'</div>';
      const stats = cerrado ? '' :
        '<div style="font-size:12px;color:#333;margin-top:6px;line-height:1.35">'+
          '<b>'+info.muns+'</b> muns · <b>'+info.sup.toFixed(0)+'</b> km²<br>'+
          '<b>'+info.pob.toLocaleString('es-ES')+'</b> hab'+
        '</div>';
      return '<div style="background:'+(cerrado?'#ffe8e8':'#fff')+';border:3px solid '+(cerrado?'#b31f26':'#1a1a1a')+';border-radius:12px;padding:10px 12px;text-align:center;box-shadow:0 3px 6px #0004">'+
        '<div style="font-size:18px;font-weight:900;color:#b31f26;margin-bottom:4px;line-height:1.1">▲ '+p+'</div>'+
        bomIco + stats +
      '</div>';
    }).join('');

    // Leyenda de tiempos
    const legendHtml =
      '<div style="background:#fff;border:3px solid #1a1a1a;border-radius:12px;padding:12px 14px;box-shadow:0 3px 8px #0004">'+
        '<div style="font-size:16px;font-weight:900;color:#b31f26;margin-bottom:10px;text-align:center">TIEMPO DE INTERVENCIÓN</div>'+
        '<div style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700">'+
          '<div style="display:flex;align-items:center;gap:8px"><span style="width:24px;height:20px;background:'+COL.v+';border:1.5px solid #333;border-radius:3px"></span>0 – 15 min</div>'+
          '<div style="display:flex;align-items:center;gap:8px"><span style="width:24px;height:20px;background:'+COL.a+';border:1.5px solid #333;border-radius:3px"></span>15 – 35 min</div>'+
          '<div style="display:flex;align-items:center;gap:8px"><span style="width:24px;height:20px;background:'+COL.n+';border:1.5px solid #333;border-radius:3px"></span>35 – 45 min</div>'+
          '<div style="display:flex;align-items:center;gap:8px"><span style="width:24px;height:20px;background:'+COL.r+';border:1.5px solid #333;border-radius:3px"></span>&gt; 45 min</div>'+
          '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:6px;border-top:1px dashed #999"><span style="width:24px;height:20px;background:#95a5a6;border:1.5px solid #333;border-radius:3px"></span>Sin cobertura</div>'+
        '</div>'+
      '</div>';

    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-99999px;top:0;width:'+W+'px;height:'+H+'px;background:#b31f26;font-family:Segoe UI,Arial,sans-serif;overflow:hidden;padding:30px;box-sizing:border-box';
    box.innerHTML =
      // Marco interior blanco con esquinas redondeadas (efecto tarjeta)
      '<div style="width:100%;height:100%;background:#faf3e0;border-radius:32px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 6px #fff, inset 0 0 0 10px #b31f26">'+
        // Cabecera roja
        '<div style="background:#b31f26;color:#fff;padding:30px 40px 26px 40px">'+
          '<div style="display:inline-block;background:#e67e22;color:#fff;font-size:20px;font-weight:800;padding:6px 22px;border-radius:6px;letter-spacing:.06em">ℹ  INFORMACIÓN</div>'+
          '<h1 style="font-size:64px;font-weight:900;margin:16px 0 0;line-height:1.02;letter-spacing:-.01em">Personal en Bomberos DPZ</h1>'+
        '</div>'+
        // Contenido: mapa + leyenda al lado
        '<div style="display:flex;gap:20px;padding:24px 30px 20px">'+
          '<div id="poster-mapa" style="flex:1;height:820px;background:#f4f1ea;border:3px solid #1a1a1a;border-radius:16px"></div>'+
          '<div style="width:220px;flex-shrink:0">'+ legendHtml +'</div>'+
        '</div>'+
        // Tarjetas de parques (grid 3×3)
        '<div style="padding:0 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+ cardsHtml +'</div>'+
        // Footer rojo→naranja
        '<div style="position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(90deg,#b31f26 0%,#e67e22 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:900;letter-spacing:.02em">'+
          '<span style="background:#fff;color:#b31f26;width:48px;height:48px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-right:14px;font-size:28px">🔥</span>'+
          'SOS Bomberos DPZ'+
        '</div>'+
      '</div>';
    document.body.appendChild(box);

    // Mapa dentro del poster (sin tiles, solo polígonos + iconos)
    const posterMap = L.map('poster-mapa',{zoomControl:false,attributionControl:false});
    const capaPMuns = L.layerGroup().addTo(posterMap);
    const capaPLbls = L.layerGroup().addTo(posterMap);
    const b = L.latLngBounds();
    Object.entries(DATOS.muns).forEach(([mun,mv])=>{
      if(!mv.poligonos || !mv.poligonos.length) return;
      const asig = parqueAsignado(mun);
      const col = asig ? colorTiempo(asig.min) : COL_GRIS;
      mv.poligonos.forEach(poly=>{
        if(poly.length<3) return;
        L.polygon(poly,{color:'#333',weight:0.6,opacity:0.7,fillColor:col,fillOpacity:0.6,interactive:false}).addTo(capaPMuns);
        poly.forEach(p=>b.extend(p));
      });
    });
    // Solo un pequeño marcador con inicial de parque (los detalles van en las tarjetas)
    Object.entries(DATOS.parques).forEach(([p,pv])=>{
      const info = parquesInfo[p];
      const cerrado = info.n <= 0;
      const bg = cerrado ? '#888' : '#b31f26';
      L.marker([pv.lat,pv.lon],{icon:L.divIcon({className:'',html:
        '<div style="background:'+bg+';color:#fff;width:38px;height:38px;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 3px 6px #0007;transform:translate(-50%,-50%)">🚒</div>',
        iconSize:[0,0], iconAnchor:[0,0]}),interactive:false,zIndexOffset:1000}).addTo(capaPLbls);
    });
    if(b.isValid()) posterMap.fitBounds(b,{padding:[20,20]});

    await new Promise(r=>setTimeout(r, 400));

    const canvas = await html2canvas(box,{
      width:W, height:H, scale:1,
      useCORS:true, allowTaint:true, backgroundColor:'#b31f26', logging:false
    });
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sosdpz_personal_bomberos_'+new Date().toISOString().slice(0,10)+'.png';
    a.click();

    posterMap.remove();
    document.body.removeChild(box);
  } catch(e){
    alert('Error generando poster: '+e.message);
    console.error(e);
  }
  btn.textContent = txt;
  btn.disabled = false;
}

// ─── Drag de la leyenda ───────────────────────────────────────
function initDragLeyenda(){
  const el = document.getElementById('legend-map');
  if(!el) return;
  let dragging=false, sx=0, sy=0, startL=0, startT=0;
  const start = (e)=>{
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY;
    // Convertir a coords absolutas dentro del wrapper
    const wrap = document.getElementById('map-wrap').getBoundingClientRect();
    const r = el.getBoundingClientRect();
    startL = r.left - wrap.left;
    startT = r.top  - wrap.top;
    el.style.left = startL+'px';
    el.style.right = 'auto';
    el.style.top  = startT+'px';
    e.preventDefault();
  };
  const move = (e)=>{
    if(!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - sx, dy = t.clientY - sy;
    el.style.left = (startL+dx)+'px';
    el.style.top  = (startT+dy)+'px';
    e.preventDefault();
  };
  const end = ()=>{ dragging=false; };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
  // Cortar propagación de wheel/dblclick para no zoomear el mapa
  ['wheel','dblclick','contextmenu'].forEach(ev=>el.addEventListener(ev, e=>e.stopPropagation()));
}

// ─── Arranque ──────────────────────────────────────────────────
fetch('datos_operativos.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  DATOS = d;
  // Ajustar bounds al conjunto de muns
  const b = L.latLngBounds();
  Object.values(DATOS.muns).forEach(mv=>{
    (mv.poligonos||[]).forEach(poly=>poly.forEach(p=>b.extend(p)));
  });
  if(b.isValid()) map.fitBounds(b, {padding:[20,20]});
  refrescar();
  initDragLeyenda();
  // En móvil: arrancar con el panel oculto para no tapar el mapa
  if(window.innerWidth<=768){
    document.querySelector('aside').classList.add('oculto');
    document.getElementById('app').classList.add('panel-oculto');
    setTimeout(()=>map.invalidateSize(), 200);
  }
}).catch(e=>{
  document.getElementById('parques-lista').innerHTML =
    '<div style="color:#c0392b;padding:20px">Error cargando datos: '+e.message+'</div>';
});
